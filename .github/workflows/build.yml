name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --clean --noconfirm War-Auto.spec
      - run: python assets/verifier_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: War-Auto
          path: dist/War-Auto.exe
